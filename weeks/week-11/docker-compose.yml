version: '3.9'
services:
  devices-svc-s10:
    image: devices-svc-s10:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-net
  stub:
    image: busybox:latest
    command: ["sh", "-c", "sleep 3600"]
    networks:
      - app-net
  gateway:
    image: nginx:alpine
    depends_on:
      - devices-svc-s10
    networks:
      - app-net
networks:
  app-net:
    driver: bridge
